# Render Blueprint configuration for Energy Saving Backend
services:
  - type: web
    name: energy-saving-backend
    env: node
    plan: free
    rootDir: Energy_Saving/energy_saving/energy_saving/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: EMAIL_USER
        value: "your_email@gmail.com"
      - key: EMAIL_PASS
        value: "your_gmail_app_password"
      - key: SUPABASE_URL
        value: "https://your-project.supabase.co"
      - key: SUPABASE_KEY
        value: "your-supabase-anon-key"
